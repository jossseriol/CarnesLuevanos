<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prueba de iPhone · Carnes Luévanos</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #08131f;
        color: #fff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(90vw, 520px);
        padding: 28px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.06);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        color: #cbd5e1;
        font-size: 17px;
        line-height: 1.45;
      }
      a {
        display: inline-block;
        margin-top: 12px;
        color: #08131f;
        background: #f6aa1c;
        padding: 14px 18px;
        border-radius: 12px;
        font-weight: 800;
        text-decoration: none;
      }
      code {
        color: #f6aa1c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Si ves esto, el iPhone sí está conectado.</h1>
      <p>Esta página proviene del mismo servidor de la PWA: <code>5173</code>.</p>
      <p>Si esta página abre, pero la aplicación principal no, elimina el icono anterior de la pantalla de inicio y vuelve a agregarlo desde Safari.</p>
      <a href="/">Abrir PWA</a>
    </main>
